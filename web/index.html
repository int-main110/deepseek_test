<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天气</title>
<style>
  :root {
    --blue: #0071e3;
    --blue-light: #5e9eff;
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #aeaeb2;
    --bg: #f5f5f7;
    --card-bg: rgba(255,255,255,0.72);
    --card-border: rgba(0,0,0,0.06);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.06), 0 2px 6px rgba(0,0,0,0.04);
    --radius: 20px;
    --radius-sm: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 20px 80px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background 1.2s ease;
  }

  /* ── 主题背景 ── */
  body.theme-clear  { background: linear-gradient(180deg, #d6e9ff 0%, #e8f4fd 40%, #f5f5f7 100%); }
  body.theme-cloudy { background: linear-gradient(180deg, #e8e9ed 0%, #efeff2 40%, #f5f5f7 100%); }
  body.theme-rain   { background: linear-gradient(180deg, #c8d6e5 0%, #dfe6ed 40%, #f0f2f5 100%); }
  body.theme-snow   { background: linear-gradient(180deg, #e8eef4 0%, #f0f3f7 40%, #f8f9fb 100%); }
  body.theme-storm  { background: linear-gradient(180deg, #b0b8c4 0%, #cdd3db 40%, #e8eaef 100%); }
  body.theme-fog    { background: linear-gradient(180deg, #dde1e6 0%, #e8eaef 40%, #f2f3f6 100%); }

  /* ── 浮动光斑 ── */
  .bg-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
    animation: orbDrift 24s ease-in-out infinite;
  }
  .bg-orb:nth-child(1) {
    width: 500px; height: 500px;
    background: #5e9eff;
    top: -150px; right: -100px;
    animation-delay: 0s;
  }
  .bg-orb:nth-child(2) {
    width: 400px; height: 400px;
    background: #40c8e0;
    bottom: -120px; left: -80px;
    animation-delay: -8s;
  }
  .bg-orb:nth-child(3) {
    width: 300px; height: 300px;
    background: #a78bfa;
    top: 40%; left: 55%;
    animation-delay: -16s;
  }
  @keyframes orbDrift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25%  { transform: translate(50px, -30px) scale(1.12); }
    50%  { transform: translate(-20px, 40px) scale(0.92); }
    75%  { transform: translate(-40px, -20px) scale(1.08); }
  }

  .container { width: 100%; max-width: 440px; position: relative; z-index: 1; }

  /* ── 头部 ── */
  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .header h1 {
    font-size: 1.75rem;
    font-weight: 590;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .header p {
    color: var(--text-secondary);
    font-size: 0.9rem;
    font-weight: 400;
    margin-top: 2px;
    letter-spacing: 0.01em;
  }

  /* ── 搜索框 ── */
  .search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .search-box input {
    flex: 1;
    padding: 13px 18px;
    border-radius: 30px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 400;
    outline: none;
    transition: all 0.25s ease;
    box-shadow: var(--shadow-sm);
  }
  .search-box input:focus {
    border-color: rgba(0,113,227,0.3);
    box-shadow: 0 0 0 4px rgba(0,113,227,0.08), var(--shadow-sm);
  }
  .search-box input::placeholder { color: var(--text-tertiary); }
  .search-box button {
    padding: 13px 22px;
    border-radius: 30px;
    border: none;
    background: var(--blue);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(0,113,227,0.25);
  }
  .search-box button:hover {
    background: #0077ed;
    box-shadow: 0 4px 14px rgba(0,113,227,0.35);
    transform: translateY(-0.5px);
  }
  .search-box button:active { transform: scale(0.97); }
  .search-box button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

  /* ── 加载 ── */
  .loader {
    display: none;
    text-align: center;
    padding: 48px 20px;
  }
  .loader.active { display: block; }
  .spinner {
    width: 28px; height: 28px;
    border: 2.5px solid rgba(0,0,0,0.08);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader p { color: var(--text-secondary); font-size: 0.9rem; }

  /* ── 城市选择 ── */
  .city-choices {
    display: none;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }
  .city-choices.active { display: flex; }
  .city-choice {
    padding: 15px 18px;
    border-radius: var(--radius-sm);
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--card-border);
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .city-choice:hover {
    background: rgba(255,255,255,0.9);
    box-shadow: var(--shadow-md);
    transform: scale(1.01);
  }
  .city-choice .name { font-weight: 500; font-size: 0.95rem; }
  .city-choice .region { color: var(--text-secondary); font-size: 0.8rem; margin-top: 1px; }
  .city-choice .coords { color: var(--text-tertiary); font-size: 0.78rem; }

  /* ── 天气卡片 ── */
  .weather-card {
    display: none;
    border-radius: var(--radius);
    background: var(--card-bg);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow-md);
    overflow: hidden;
    animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .weather-card.active { display: block; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card-main {
    padding: 40px 32px 28px;
    text-align: center;
  }
  .card-main .location {
    font-size: 1.1rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin-bottom: 2px;
  }
  .card-main .time {
    color: var(--text-secondary);
    font-size: 0.82rem;
    font-weight: 400;
    margin-bottom: 24px;
  }
  .card-main .weather-icon {
    font-size: 4.5rem;
    margin-bottom: 8px;
    animation: float 4s ease-in-out infinite;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.06));
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .card-main .weather-desc {
    font-size: 1.05rem;
    color: var(--text-secondary);
    font-weight: 400;
    margin-bottom: 8px;
  }
  .card-main .temp {
    font-size: 5rem;
    font-weight: 200;
    line-height: 1;
    letter-spacing: -0.04em;
    color: var(--text);
  }
  .card-main .temp span {
    font-size: 1.6rem;
    font-weight: 300;
    vertical-align: baseline;
    position: relative;
    top: -0.45em;
    margin-left: 1px;
  }

  .card-details {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    padding: 0 20px 20px;
  }
  .detail-item {
    text-align: center;
    padding: 16px 8px;
    border-radius: var(--radius-sm);
    transition: background 0.2s;
  }
  .detail-item:hover { background: rgba(0,0,0,0.02); }
  .detail-item .label {
    font-size: 0.7rem;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 500;
    margin-bottom: 6px;
  }
  .detail-item .value {
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  /* ── 预报 ── */
  .forecast {
    border-top: 1px solid rgba(0,0,0,0.06);
    padding: 20px 20px 24px;
  }
  .forecast h3 {
    font-size: 0.75rem;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 500;
    margin-bottom: 12px;
    padding: 0 4px;
  }
  .forecast-list { display: flex; flex-direction: column; }
  .forecast-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border-radius: var(--radius-sm);
    transition: background 0.2s;
  }
  .forecast-item:hover { background: rgba(0,0,0,0.02); }
  .forecast-item .day {
    width: 60px;
    font-weight: 500;
    font-size: 0.88rem;
    letter-spacing: -0.01em;
  }
  .forecast-item .day span {
    display: block;
    font-size: 0.7rem;
    color: var(--text-tertiary);
    font-weight: 400;
    letter-spacing: 0;
  }
  .forecast-item .fc-icon { font-size: 1.3rem; width: 32px; text-align: center; }
  .forecast-item .fc-desc {
    flex: 1;
    font-size: 0.82rem;
    color: var(--text-secondary);
  }
  .forecast-item .fc-rain {
    font-size: 0.75rem;
    color: var(--blue);
    min-width: 38px;
    text-align: right;
    font-weight: 500;
  }
  .forecast-item .fc-temp {
    font-weight: 500;
    font-size: 0.88rem;
    min-width: 56px;
    text-align: right;
    letter-spacing: -0.01em;
    color: var(--text-secondary);
  }
  .forecast-item.today {
    background: rgba(0,113,227,0.05);
    border: 1px solid rgba(0,113,227,0.1);
  }
  .forecast-item.today .day { color: var(--blue); }
  .forecast-item.today .fc-temp { color: var(--text); }

  /* ── 智能提示 ── */
  .tips {
    display: none;
    border-top: 1px solid rgba(0,0,0,0.06);
    padding: 16px 20px 20px;
  }
  .tips.active { display: block; }
  .tips-content {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    background: rgba(0,113,227,0.04);
    font-size: 0.88rem;
    font-weight: 400;
    line-height: 1.5;
    color: var(--text);
  }
  .tips-content .tips-icon {
    font-size: 1.3rem;
    flex-shrink: 0;
    margin-top: 1px;
  }

  /* ── 错误 ── */
  .error {
    display: none;
    padding: 14px 18px;
    border-radius: var(--radius-sm);
    background: rgba(255,59,48,0.06);
    border: 1px solid rgba(255,59,48,0.15);
    color: #ff3b30;
    text-align: center;
    font-size: 0.88rem;
    font-weight: 400;
    margin-top: 12px;
  }
  .error.active { display: block; }

  /* ── 响应式 ── */
  @media (max-width: 480px) {
    body { padding: 40px 16px 60px; }
    .card-main { padding: 32px 20px 24px; }
    .card-main .temp { font-size: 4rem; }
    .card-details { padding: 0 12px 16px; }
    .forecast-item { gap: 8px; padding: 10px 8px; }
  }
</style>
</head>
<body>

<div class="bg-orb"></div>
<div class="bg-orb"></div>
<div class="bg-orb"></div>

<div class="container">
  <div class="header">
    <h1>天气</h1>
    <p>免费 · 实时 · 全球</p>
  </div>

  <div class="search-box">
    <input type="text" id="cityInput" placeholder="搜索城市..." autocomplete="off">
    <button id="searchBtn" onclick="searchWeather()">搜索</button>
  </div>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <p>正在获取天气数据...</p>
  </div>

  <div class="city-choices" id="cityChoices"></div>

  <div class="weather-card" id="weatherCard">
    <div class="card-main">
      <div class="location" id="location">—</div>
      <div class="time" id="time">—</div>
      <div class="weather-icon" id="weatherIcon">—</div>
      <div class="weather-desc" id="weatherDesc">—</div>
      <div class="temp" id="temp">—<span>°C</span></div>
    </div>
    <div class="card-details">
      <div class="detail-item">
        <div class="label">湿度</div>
        <div class="value" id="humidity">—</div>
      </div>
      <div class="detail-item">
        <div class="label">体感</div>
        <div class="value" id="feelsLike">—</div>
      </div>
      <div class="detail-item">
        <div class="label">风速</div>
        <div class="value" id="wind">—</div>
      </div>
      <div class="detail-item">
        <div class="label">风向</div>
        <div class="value" id="windDir">—</div>
      </div>
      <div class="detail-item">
        <div class="label">气压</div>
        <div class="value" id="pressure">—</div>
      </div>
      <div class="detail-item">
        <div class="label">日出/日落</div>
        <div class="value" id="sun">—</div>
      </div>
    </div>
    <div class="forecast">
      <h3>未来几天</h3>
      <div class="forecast-list" id="forecastList"></div>
    </div>
    <div class="tips" id="tips"></div>
  </div>

  <div class="error" id="error"></div>
</div>

<script>
// ─── 数据映射 ──────────────────────────────────────
const WMO_CODES = {
  0:  { desc: "晴天",       icon: "☀️", theme: "clear" },
  1:  { desc: "大部晴朗",   icon: "🌤️", theme: "clear" },
  2:  { desc: "多云",       icon: "⛅", theme: "cloudy" },
  3:  { desc: "阴天",       icon: "☁️", theme: "cloudy" },
  45: { desc: "雾",         icon: "🌫️", theme: "fog" },
  48: { desc: "冻雾",       icon: "🌫️", theme: "fog" },
  51: { desc: "小毛毛雨",   icon: "🌦️", theme: "rain" },
  53: { desc: "毛毛雨",     icon: "🌦️", theme: "rain" },
  55: { desc: "大毛毛雨",   icon: "🌧️", theme: "rain" },
  56: { desc: "冻毛毛雨",   icon: "🌧️", theme: "rain" },
  57: { desc: "冻毛毛雨(大)",icon: "🌧️", theme: "rain" },
  61: { desc: "小雨",       icon: "🌦️", theme: "rain" },
  63: { desc: "中雨",       icon: "🌧️", theme: "rain" },
  65: { desc: "大雨",       icon: "🌧️", theme: "rain" },
  66: { desc: "冻雨(小)",   icon: "🌧️", theme: "rain" },
  67: { desc: "冻雨(大)",   icon: "🌧️", theme: "rain" },
  71: { desc: "小雪",       icon: "🌨️", theme: "snow" },
  73: { desc: "中雪",       icon: "🌨️", theme: "snow" },
  75: { desc: "大雪",       icon: "❄️", theme: "snow" },
  77: { desc: "雪粒",       icon: "🌨️", theme: "snow" },
  80: { desc: "阵雨(小)",   icon: "🌦️", theme: "rain" },
  81: { desc: "阵雨",       icon: "🌧️", theme: "rain" },
  82: { desc: "大阵雨",     icon: "⛈️", theme: "rain" },
  85: { desc: "阵雪(小)",   icon: "🌨️", theme: "snow" },
  86: { desc: "阵雪(大)",   icon: "❄️", theme: "snow" },
  95: { desc: "雷暴",       icon: "⛈️", theme: "storm" },
  96: { desc: "雷暴+冰雹(小)",icon: "⛈️", theme: "storm" },
  99: { desc: "雷暴+冰雹(大)",icon: "⛈️", theme: "storm" },
};

const WINDS = ["北", "东北", "东", "东南", "南", "西南", "西", "西北"];
const WEEKDAYS = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

// ─── DOM 引用 ──────────────────────────────────────
const cityInput = document.getElementById("cityInput");
const searchBtn = document.getElementById("searchBtn");
const loader = document.getElementById("loader");
const weatherCard = document.getElementById("weatherCard");
const cityChoices = document.getElementById("cityChoices");
const errorEl = document.getElementById("error");

// ─── HTTP ──────────────────────────────────────────
async function httpGet(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ─── 地理编码 ──────────────────────────────────────
async function geocode(city) {
  const q = encodeURIComponent(city);
  let results = [];

  // 第一次搜索
  const data = await httpGet(
    `https://geocoding-api.open-meteo.com/v1/search?name=${q}&count=5&language=zh&format=json`
  );
  if (data.results?.length) results = data.results;

  // 智能补全：中文短词且结果都是小地方时，尝试加"市"
  const hasChinese = /[\u4e00-\u9fa5]/.test(city);
  const allSmall = results.length > 0 && results.every(r => !r.population || r.population < 100000);
  if (hasChinese && (results.length === 0 || allSmall)) {
    const q2 = encodeURIComponent(city + "市");
    const data2 = await httpGet(
      `https://geocoding-api.open-meteo.com/v1/search?name=${q2}&count=3&language=zh&format=json`
    );
    if (data2.results?.length) {
      // 合并去重（按坐标）
      const seen = new Set(results.map(r => `${r.latitude.toFixed(2)},${r.longitude.toFixed(2)}`));
      for (const r of data2.results) {
        const key = `${r.latitude.toFixed(2)},${r.longitude.toFixed(2)}`;
        if (!seen.has(key)) {
          results.push(r);
          seen.add(key);
        }
      }
    }
  }

  if (!results.length) throw new Error(`找不到城市: ${city}`);

  // 按人口降序排列，大城市优先
  results.sort((a, b) => (b.population || 0) - (a.population || 0));
  return results;
}

// ─── 获取天气 ──────────────────────────────────────
async function fetchWeather(lat, lon) {
  const params = new URLSearchParams({
    latitude: lat,
    longitude: lon,
    current: "temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl",
    daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,sunrise,sunset",
    forecast_days: 7,
    timezone: "auto",
  });
  return httpGet(`https://api.open-meteo.com/v1/forecast?${params}`);
}

// ─── 风向 ──────────────────────────────────────────
function windDir(deg) {
  if (deg == null) return "—";
  return WINDS[Math.round(deg / 45) % 8];
}

// ─── 设置主题 ──────────────────────────────────────
function setTheme(code) {
  const meta = WMO_CODES[code] || WMO_CODES[0];
  document.body.className = `theme-${meta.theme}`;
}

// ─── 渲染天气 ──────────────────────────────────────
function renderWeather(data, cityName, country) {
  const cur = data.current || {};
  const daily = data.daily || {};
  const code = cur.weather_code ?? 0;
  const meta = WMO_CODES[code] || WMO_CODES[0];
  const tz = data.timezone || "Asia/Shanghai";

  setTheme(code);

  // 城市当地时间
  const now = new Date();
  const localTime = now.toLocaleString("zh-CN", { timeZone: tz, hour12: false });
  const localDateStr = now.toLocaleDateString("zh-CN", { timeZone: tz })
    .replace(/\//g, "-")
    .replace(/(\d{4})-(\d{1,2})-(\d{1,2})/, (_, y, m, d) =>
      `${y}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`
    );

  document.getElementById("location").textContent = `📍 ${cityName}, ${country}`;
  document.getElementById("time").textContent = `🕐 ${localTime}`;
  document.getElementById("weatherIcon").textContent = meta.icon;
  document.getElementById("weatherDesc").textContent = meta.desc;
  document.getElementById("temp").innerHTML = `${cur.temperature_2m ?? "—"}<span>°C</span>`;
  document.getElementById("humidity").textContent = `${cur.relative_humidity_2m ?? "—"}%`;
  document.getElementById("wind").textContent = `${cur.wind_speed_10m ?? "—"} km/h`;
  document.getElementById("pressure").textContent = `${cur.pressure_msl ?? "—"} hPa`;
  document.getElementById("feelsLike").textContent = `${cur.apparent_temperature ?? "—"}°C`;
  document.getElementById("windDir").textContent = windDir(cur.wind_direction_10m);

  const sunrise = daily.sunrise?.[0] ? daily.sunrise[0].slice(-5) : "—";
  const sunset = daily.sunset?.[0] ? daily.sunset[0].slice(-5) : "—";
  document.getElementById("sun").textContent = `${sunrise} / ${sunset}`;

  // 逐日预报
  const list = document.getElementById("forecastList");
  list.innerHTML = "";

  (daily.time || []).forEach((dateStr, i) => {
    const fcCode = daily.weather_code?.[i] ?? 0;
    const fcMeta = WMO_CODES[fcCode] || WMO_CODES[0];
    const hi = daily.temperature_2m_max?.[i] ?? "—";
    const lo = daily.temperature_2m_min?.[i] ?? "—";
    const rain = daily.precipitation_sum?.[i] ?? 0;
    const dt = new Date(dateStr + "T00:00:00");
    const wd = WEEKDAYS[dt.getDay()];
    const isToday = dateStr === localDateStr;

    const div = document.createElement("div");
    div.className = `forecast-item${isToday ? " today" : ""}`;
    div.innerHTML = `
      <div class="day">${wd}<span>${dateStr.slice(5)}</span></div>
      <div class="fc-icon">${fcMeta.icon}</div>
      <div class="fc-desc">${fcMeta.desc}</div>
      ${rain > 0 ? `<div class="fc-rain">💧${rain}mm</div>` : ""}
      <div class="fc-temp">${lo}°C ~ ${hi}°C</div>
    `;
    list.appendChild(div);
  });

  // ── 智能提示 ──
  const tipsEl = document.getElementById("tips");
  const tip = getWeatherTip(code, cur, daily);
  if (tip) {
    tipsEl.innerHTML = `<div class="tips-content"><span class="tips-icon">${tip.icon}</span><span>${tip.text}</span></div>`;
    tipsEl.classList.add("active");
  } else {
    tipsEl.classList.remove("active");
  }

  weatherCard.classList.add("active");
}

// ─── 智能提示生成 ──────────────────────────────────
function getWeatherTip(code, cur, daily) {
  const temp = cur.temperature_2m;
  const wind = cur.wind_speed_10m;
  const todayRain = daily?.precipitation_sum?.[0] || 0;
  const tomorrowRain = daily?.precipitation_sum?.[1] || 0;
  const todayCode = daily?.weather_code?.[0];
  const tomorrowCode = daily?.weather_code?.[1];
  const maxTemp = daily?.temperature_2m_max?.[0];
  const minTemp = daily?.temperature_2m_min?.[0];

  // 今天的天气码（优先当日预报，其次当前）
  const effectiveCode = todayCode ?? code;

  // 雷暴
  if ([95, 96, 99].includes(effectiveCode) || [95, 96, 99].includes(code)) {
    return { icon: "⛈️", text: "雷暴天气，尽量避免外出，远离树木和广告牌" };
  }
  // 大雨 / 暴雨
  if ([65, 67, 82].includes(effectiveCode)) {
    return { icon: "🌧️", text: "大雨天气，出门记得带伞，注意路面湿滑" };
  }
  // 中雨 / 阵雨
  if ([63, 66, 80, 81].includes(effectiveCode)) {
    return { icon: "☂️", text: "有雨，出门请带伞" };
  }
  // 小雨 / 毛毛雨
  if ([51, 53, 55, 56, 57, 61].includes(effectiveCode)) {
    return { icon: "☂️", text: "有小雨，建议带伞" };
  }
  // 今天预报有雨但当前不是雨天
  if (todayRain > 2 && ![51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(code)) {
    return { icon: "☂️", text: "今天有雨，出门记得带伞" };
  }
  // 雪
  if ([71, 73, 75, 77, 85, 86].includes(effectiveCode) || [71, 73, 75, 77, 85, 86].includes(code)) {
    return { icon: "❄️", text: "下雪天气，注意保暖，路面可能结冰" };
  }
  // 雾
  if (code === 45 || code === 48) {
    return { icon: "🌫️", text: "有雾，能见度低，开车请减速慢行" };
  }
  // 高温
  if (maxTemp >= 35 || temp >= 33) {
    return { icon: "🥵", text: "天气炎热，注意防暑降温，多喝水" };
  }
  // 寒冷
  if (temp <= 5 || (minTemp ?? 99) <= 0) {
    return { icon: "🧣", text: "天气寒冷，出门注意保暖，多穿衣服" };
  }
  // 大风
  if (wind >= 25) {
    return { icon: "💨", text: "风力较大，注意防风，远离易坠物" };
  }
  // 今天晴天但明天有雨
  if ((code === 0 || code === 1) && tomorrowRain > 5) {
    return { icon: "☀️", text: "今天天气不错，但明天有雨，趁今天安排好户外活动吧" };
  }
  // 晴天
  if (code === 0 || code === 1) {
    return { icon: "☀️", text: "天气晴好，适合户外活动和晾晒" };
  }
  // 多云 / 阴天
  if (code === 2) {
    return { icon: "⛅", text: "多云天气，温度舒适，适合出行" };
  }
  if (code === 3) {
    return { icon: "☁️", text: "阴天，今天没有雨，适合室内外活动" };
  }

  return null;
}

// ─── 显示城市选择 ──────────────────────────────────
function showCityChoices(results) {
  cityChoices.innerHTML = "";
  results.forEach((r, i) => {
    const region = [r.admin1, r.country].filter(Boolean).join(", ");
    const div = document.createElement("div");
    div.className = "city-choice";
    div.innerHTML = `
      <div>
        <div class="name">${r.name}</div>
        <div class="region">${region}</div>
      </div>
      <div class="coords">📍 ${r.latitude.toFixed(2)}, ${r.longitude.toFixed(2)}</div>
    `;
    div.onclick = () => loadWeatherForCity(r);
    cityChoices.appendChild(div);
  });
  cityChoices.classList.add("active");
}

// ─── 加载城市天气 ──────────────────────────────────
async function loadWeatherForCity(city) {
  cityChoices.classList.remove("active");
  errorEl.classList.remove("active");
  weatherCard.classList.remove("active");
  loader.classList.add("active");

  try {
    const data = await fetchWeather(city.latitude, city.longitude);
    renderWeather(data, city.name || "—", city.country || "—");
  } catch (e) {
    errorEl.textContent = `❌ ${e.message}`;
    errorEl.classList.add("active");
  } finally {
    loader.classList.remove("active");
  }
}

// ─── 搜索 ──────────────────────────────────────────
async function searchWeather() {
  const city = cityInput.value.trim();
  if (!city) {
    weatherCard.classList.remove("active");
    cityChoices.classList.remove("active");
    errorEl.classList.remove("active");
    return;
  }

  weatherCard.classList.remove("active");
  cityChoices.classList.remove("active");
  errorEl.classList.remove("active");
  loader.classList.add("active");
  searchBtn.disabled = true;

  try {
    const results = await geocode(city);

    // 智能自动选择：第一名有人口数据且其他都没有 → 直接选中
    const topHasPop = results[0]?.population > 0;
    const othersNoPop = results.slice(1).every(r => !r.population || r.population < 1000);
    if (results.length === 1 || (topHasPop && othersNoPop)) {
      await loadWeatherForCity(results[0]);
    } else {
      showCityChoices(results);
    }
  } catch (e) {
    errorEl.textContent = `❌ ${e.message}`;
    errorEl.classList.add("active");
  } finally {
    loader.classList.remove("active");
    searchBtn.disabled = false;
  }
}

// ─── 输入自动搜索（防抖 400ms）────────────────────
let debounceTimer;
cityInput.addEventListener("input", () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(searchWeather, 400);
});
// 回车立即搜索
cityInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    clearTimeout(debounceTimer);
    searchWeather();
  }
});

// ─── 默认加载北京 ──────────────────────────────────
window.addEventListener("DOMContentLoaded", () => {
  cityInput.value = "北京";
  searchWeather();
});
</script>
